<nav class="site-nav" aria-label="Section navigation">
  <div class="nav-inner container">
    <a class="brand" href="#top" (click)="closeMenu()">TA</a>

    <ul id="nav-links" class="nav-links" [class.open]="menuOpen()">
      @for (section of sections(); track section.id) {
        <li>
          <a
            [href]="'#' + section.id"
            [class.active]="activeId() === section.id"
            [attr.aria-current]="activeId() === section.id ? 'location' : null"
            (click)="closeMenu()"
            >{{ section.label }}</a
          >
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button
        type="button"
        class="icon-btn theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>

      <button
        type="button"
        class="icon-btn menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="nav-links"
        aria-label="Toggle navigation menu"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="18" />
      </button>
    </div>
  </div>
</nav>
