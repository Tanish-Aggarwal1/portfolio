<section id="about" class="section" aria-labelledby="about-heading">
  <div class="container about-grid">
    <div class="about-media">
      @if (!imageFailed()) {
        <img
          [src]="about().myImg"
          alt="Portrait of Tanish Aggarwal"
          width="320"
          height="320"
          loading="lazy"
          (error)="imageFailed.set(true)"
        />
      } @else {
        <div class="avatar-placeholder" aria-hidden="true">TA</div>
      }
    </div>

    <div class="about-copy">
      <span class="section-eyebrow">About</span>
      <h2 id="about-heading" class="section-heading">A bit about me</h2>

      <p>{{ about().aboutMe }}</p>
      <p>{{ about().aboutMeLine2 }}</p>

      <div class="goal-card card">
        <h3>Career goal</h3>
        <p>{{ about().careerGoal }}</p>
      </div>

      <h3 class="about-subheading">Beyond code</h3>
      <ul class="interest-list">
        @for (interest of about().interests; track interest) {
          <li class="badge">{{ interest }}</li>
        }
      </ul>
    </div>
  </div>
</section>
