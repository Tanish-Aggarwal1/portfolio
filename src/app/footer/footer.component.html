<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copyright">&copy; {{ year }} {{ personal().first }} {{ personal().last }}</p>

    <ul class="footer-tech">
      <li class="footer-tech-heading">{{ footer().listHeading }}</li>
      @for (tech of footer().technologies; track tech.name) {
        <li class="badge" [title]="tech.note">{{ tech.name }}</li>
      }
    </ul>

    <a class="back-to-top" href="#top">
      <app-icon name="arrow-up" [size]="16" />
      Back to top
    </a>
  </div>
</footer>
